name: Proof HTML
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: anishathalye/proof-html@v1.1.0
        with:
          directory: ./
          # DOI linkovi vode na sajtove izdavača (IEEE, Wiley, SPIE...) koji često
          # blokiraju automatske provere, pa ih preskačemo da provera ne bi pala.
          url_ignore_re: |
            ^https://doi\.org/
